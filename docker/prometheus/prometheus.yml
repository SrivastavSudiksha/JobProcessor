global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "job-processor"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: "distributed-job-processor"

  # If running the app inside Docker network, use:
  # - targets: ["app:8080"]
